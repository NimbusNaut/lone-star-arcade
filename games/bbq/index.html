<!DOCTYPE html>
<html>
<head>
  <title>BBQ Dash</title>
  <style>
    body {
      margin: 0;
      background: #BF2F2F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial;
    }
    canvas {
      background: #1F3A5F;
      border: 4px solid white;
    }
  </style>
</head>
<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let basketX = 150;
let foodY = 0;
let foodX = Math.random() * 350;

let score = 0;

document.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  basketX = e.clientX - rect.left - 40;
});

function draw() {
  ctx.clearRect(0,0,400,600);

  // basket
  ctx.fillStyle = "white";
  ctx.fillRect(basketX, 550, 80, 20);

  // food
  ctx.beginPath();
  ctx.arc(foodX, foodY, 10, 0, Math.PI*2);
  ctx.fill();

  // score
  ctx.fillText("Score: " + score, 10, 20);
}

function update() {
  foodY += 4;

  if (foodY > 550 && foodX > basketX && foodX < basketX + 80) {
    score++;
    foodY = 0;
    foodX = Math.random() * 350;
  }

  if (foodY > 600) {
    foodY = 0;
    foodX = Math.random() * 350;
  }
}

function loop() {
  update();
  draw();
}

setInterval(loop, 1000/60);
</script>

</body>
</html>
