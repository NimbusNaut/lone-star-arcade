<!DOCTYPE html>
<html>
<head>
  <title>BBQ Dash</title>
  <style>
    body {
      margin: 0;
      background: #BF2F2F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      background: #1F3A5F;
      border: 4px solid white;
    }
  </style>
</head>

<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let basketX = 150;
let foodY = 0;
let foodX = Math.random() * 350;

let score = 0;
let gameOver = false;

document.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  basketX = e.clientX - rect.left - 40;
});

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 25);

  // basket
  ctx.fillRect(basketX, 550, 80, 20);

  // food
  ctx.beginPath();
  ctx.arc(foodX, foodY, 10, 0, Math.PI * 2);
  ctx.fill();

  if (gameOver) {
    ctx.font = "32px Arial";
    ctx.fillText("Game Over", 110, 280);
    ctx.font = "18px Arial";
    ctx.fillText("Refresh to play again", 105, 315);
  }
}

function update() {
  if (gameOver) return;

  foodY += 4;

  // caught
  if (foodY > 550 && foodX > basketX && foodX < basketX + 80) {
    score++;
    foodY = 0;
    foodX = Math.random() * 350;
  }

  // missed = game over
  if (foodY > 600) {
    endGame();
  }
}

function endGame() {
  gameOver = true;

  if (score <= 0) return;

  const name = prompt("Enter your name:");
  if (!name) return;

  saveScore(name, score);
}

function loop() {
  update();
  draw();
}

setInterval(loop, 1000 / 60);
</script>

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.saveScore = function(name, score) {
  push(ref(db, "scores/bbq"), {
    name,
    score,
    time: Date.now()
  });
}

window.getScores = async function() {
  const q = query(ref(db, "scores/bbq"), orderByChild("score"), limitToLast(10));
  const snapshot = await get(q);

  const scores = [];
  snapshot.forEach(child => {
    scores.push(child.val());
  });

  console.log(scores.reverse());
}
</script>

</body>
</html>
