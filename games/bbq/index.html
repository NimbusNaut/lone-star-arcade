<!DOCTYPE html>
<html>
<head>
  <title>BBQ Dash</title>
  <style>
    body {
      margin: 0;
      background: #BF2F2F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    canvas {
      background: #1F3A5F;
      border: 4px solid white;
    }

    #leaderboard {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      padding: 12px;
      border-radius: 8px;
      width: 200px;
      font-size: 14px;
    }

    #leaderboard strong {
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="leaderboard">
  <strong>🏆 Top Scores</strong>
  <div id="scoresList">Loading...</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let basketX = 150;
let foodY = -20;
let foodX = Math.random() * 350;
let score = 0;
let gameOver = false;

document.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  basketX = e.clientX - rect.left - 45;

  // keep basket in bounds
  if (basketX < 0) basketX = 0;
  if (basketX > 310) basketX = 310;
});

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 25);

  // basket (slightly bigger)
  ctx.fillRect(basketX, 545, 90, 25);

  // falling food
  ctx.beginPath();
  ctx.arc(foodX, foodY, 10, 0, Math.PI * 2);
  ctx.fill();

  if (gameOver) {
    ctx.font = "32px Arial";
    ctx.fillText("Game Over", 110, 280);
    ctx.font = "18px Arial";
    ctx.fillText("Refresh to play again", 105, 315);
  }
}

function update() {
  if (gameOver) return;

  foodY += 3;

  // 🔥 SIMPLE + RELIABLE CATCH LOGIC
  const ballBottom = foodY + 10;

  const basketTop = 545;
  const basketLeft = basketX;
  const basketRight = basketX + 90;

  const caught =
    ballBottom >= basketTop &&
    foodX >= basketLeft &&
    foodX <= basketRight;

  if (caught) {
    score++;
    foodY = -20;
    foodX = Math.random() * 350;
    return;
  }

  if (foodY > 620) {
    endGame();
  }
}

function endGame() {
  gameOver = true;

  if (score <= 0) return;

  const name = prompt("Enter your name:");
  if (!name) return;

  saveScore(name, score);
}

function loop() {
  update();
  draw();
}

setInterval(loop, 1000 / 60);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUvm6aa-6FjJpCS6Ly4sVucjJPuNbgW-I",
  authDomain: "lone-star-arcade.firebaseapp.com",
  databaseURL: "https://lone-star-arcade-default-rtdb.firebaseio.com/",
  projectId: "lone-star-arcade",
  storageBucket: "lone-star-arcade.firebasestorage.app",
  messagingSenderId: "883063669150",
  appId: "1:883063669150:web:2aca2e85fa0b906f86568f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.saveScore = function(name, score) {
  push(ref(db, "scores/bbq"), {
    name,
    score,
    time: Date.now()
  }).then(() => {
    getScores();
  });
};

window.getScores = async function() {
  const list = document.getElementById("scoresList");

  try {
    const q = query(ref(db, "scores/bbq"), orderByChild("score"), limitToLast(10));
    const snapshot = await get(q);

    const scores = [];
    snapshot.forEach(child => {
      scores.push(child.val());
    });

    scores.reverse();

    if (scores.length === 0) {
      list.innerHTML = "No scores yet";
      return;
    }

    list.innerHTML = scores.map((s, i) =>
      `<div>${i + 1}. ${s.name}: ${s.score}</div>`
    ).join("");

  } catch (err) {
    console.error(err);
    list.innerHTML = "⚠️ Error loading scores";
  }
};

getScores();
</script>

</body>
</html>
