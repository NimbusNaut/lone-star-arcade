<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <title>Texas Pong</title>

  <style>
    body {
      margin: 0;
      background: #1F3A5F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      background: black;
      border: 4px solid #BF2F2F;
      width: min(92vw, 800px);
      height: auto;
    }

    #leaderboard {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      padding: 12px;
      border-radius: 8px;
      width: 200px;
      font-size: 14px;
    }

    #leaderboard strong {
      display: block;
      margin-bottom: 8px;
    }

    .score-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

.score-box {
  background: #1F3A5F;
  border: 3px solid #F4F1EC;
  border-radius: 16px;
  padding: 24px;
  width: min(320px, 90vw);
  box-sizing: border-box;
  text-align: center;
  color: white;
  box-shadow: 0 0 25px rgba(191,47,47,0.7);
}

    .score-box h2 {
      margin: 0 0 8px;
      color: #F4F1EC;
    }

    .score-box p {
      margin: 6px 0;
    }

.score-box input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: 0;
  font-size: 16px;
  text-align: center;
}

    .score-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }

    .score-actions button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .score-actions button:first-child {
      background: #BF2F2F;
      color: white;
    }

    .score-actions button:last-child {
      background: #F4F1EC;
      color: #1F3A5F;
    }
  </style>
</head>

<body>

<canvas id="game" width="800" height="400"></canvas>

<div id="leaderboard">
  <strong>🏆 Top Scores</strong>
  <div id="scoresList">Loading...</div>
</div>

<div id="scoreModal" class="score-modal">
  <div class="score-box">
    <h2>🏆 New Score!</h2>
    <p>You scored <strong id="finalScore">0</strong></p>
    <p>Enter your name:</p>
    <input id="playerName" type="text" maxlength="20" placeholder="Your name" />
    <div class="score-actions">
      <button onclick="submitPlayerScore()">Save Score</button>
      <button onclick="skipScore()">Skip</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let paddleHeight = 80;
let paddleWidth = 10;

let leftY = 150;
let rightY = 150;

let ballX = 400;
let ballY = 200;
let ballSpeedX = 4;
let ballSpeedY = 4;

let score = 0;
let gameOver = false;
let scoreModalOpen = false;

function drawRect(x, y, w, h) {
  ctx.fillStyle = "white";
  ctx.fillRect(x, y, w, h);
}

function drawBall() {
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
  ctx.fill();
}

function moveBall() {
  if (gameOver || scoreModalOpen) return;

  ballX += ballSpeedX;
  ballY += ballSpeedY;

  if (ballY <= 0 || ballY >= canvas.height) {
    ballSpeedY *= -1;
  }

  if (ballX <= 20 && ballY > leftY && ballY < leftY + paddleHeight) {
    ballSpeedX *= -1;
    score++;
  }

  if (ballX >= 780 && ballY > rightY && ballY < rightY + paddleHeight) {
    ballSpeedX *= -1;
  }

  if (ballX < 0) {
    endGame();
  }

  if (ballX > canvas.width) {
    resetBallOnly();
  }
}

function resetBallOnly() {
  ballX = 400;
  ballY = 200;
  ballSpeedX = -4;
  ballSpeedY = 4;
}

function resetGame() {
  ballX = 400;
  ballY = 200;
  ballSpeedX = 4;
  ballSpeedY = 4;
  score = 0;
  gameOver = false;
  scoreModalOpen = false;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawRect(10, leftY, paddleWidth, paddleHeight);
  drawRect(780, rightY, paddleWidth, paddleHeight);

  drawBall();

  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 20, 30);

  if (gameOver) {
    ctx.font = "32px Arial";
    ctx.fillText("Game Over", 315, 190);
  }
}

function movePlayer(clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleY = canvas.height / rect.height;
  leftY = (clientY - rect.top) * scaleY - paddleHeight / 2;

  if (leftY < 0) leftY = 0;
  if (leftY > canvas.height - paddleHeight) {
    leftY = canvas.height - paddleHeight;
  }
}

document.addEventListener("mousemove", e => {
  movePlayer(e.clientY);
});

document.addEventListener("touchmove", e => {
  e.preventDefault();
  movePlayer(e.touches[0].clientY);
}, { passive: false });

function aiMove() {
  if (gameOver || scoreModalOpen) return;

  if (rightY + paddleHeight / 2 < ballY) {
    rightY += 3;
  } else {
    rightY -= 3;
  }

  if (rightY < 0) rightY = 0;
  if (rightY > canvas.height - paddleHeight) {
    rightY = canvas.height - paddleHeight;
  }
}

function endGame() {
  gameOver = true;

  if (score <= 0) {
    resetGame();
    return;
  }

  scoreModalOpen = true;
  document.getElementById("finalScore").textContent = score;
  document.getElementById("scoreModal").style.display = "flex";

  setTimeout(() => {
    document.getElementById("playerName").focus();
  }, 100);
}

function submitPlayerScore() {
  const name = document.getElementById("playerName").value.trim();

  if (!name) return;

  saveScore(name, score);
  closeScoreModal();
  resetGame();
}

function skipScore() {
  closeScoreModal();
  resetGame();
}

function closeScoreModal() {
  document.getElementById("scoreModal").style.display = "none";
  document.getElementById("playerName").value = "";
  scoreModalOpen = false;
}

document.getElementById("playerName").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    submitPlayerScore();
  }
});

function gameLoop() {
  moveBall();
  aiMove();
  draw();
}

setInterval(gameLoop, 1000 / 60);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUvm6aa-6FjJpCS6Ly4sVucjJPuNbgW-I",
  authDomain: "lone-star-arcade.firebaseapp.com",
  databaseURL: "https://lone-star-arcade-default-rtdb.firebaseio.com/",
  projectId: "lone-star-arcade",
  storageBucket: "lone-star-arcade.firebasestorage.app",
  messagingSenderId: "883063669150",
  appId: "1:883063669150:web:2aca2e85fa0b906f86568f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.saveScore = function(name, score) {
  push(ref(db, "scores/pong"), {
    name,
    score,
    time: Date.now()
  }).then(() => {
    getScores();
  });
};

window.getScores = async function() {
  const list = document.getElementById("scoresList");

  try {
    const q = query(ref(db, "scores/pong"), orderByChild("score"), limitToLast(5));
    const snapshot = await get(q);

    const scores = [];
    snapshot.forEach(child => {
      scores.push(child.val());
    });

    scores.reverse();

    if (scores.length === 0) {
      list.innerHTML = "No scores yet";
      return;
    }

    list.innerHTML = scores.map((s, i) =>
      `<div>${i + 1}. ${s.name}: ${s.score}</div>`
    ).join("");

  } catch (err) {
    console.error(err);
    list.innerHTML = "⚠️ Error loading scores";
  }
};

getScores();
</script>

</body>
</html>
