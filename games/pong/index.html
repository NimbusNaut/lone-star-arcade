<!DOCTYPE html>
<html>
<head>
  <title>Texas Pong</title>
  <style>
    body {
      margin: 0;
      background: #1F3A5F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
    }

    canvas {
      background: black;
      border: 4px solid #BF2F2F;
    }

    #leaderboard {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      padding: 12px;
      border-radius: 8px;
      width: 200px;
      font-size: 14px;
    }

    #leaderboard strong {
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<canvas id="game" width="800" height="400"></canvas>

<div id="leaderboard">
  <strong>🏆 Top Scores</strong>
  <div id="scoresList">Loading...</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let paddleHeight = 80;
let paddleWidth = 10;

let leftY = 150;
let rightY = 150;

let ballX = 400;
let ballY = 200;
let ballSpeedX = 4;
let ballSpeedY = 4;

let score = 0;

function drawRect(x, y, w, h) {
  ctx.fillStyle = "white";
  ctx.fillRect(x, y, w, h);
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
  ctx.fill();
}

function moveBall() {
  ballX += ballSpeedX;
  ballY += ballSpeedY;

  // top/bottom bounce
  if (ballY <= 0 || ballY >= canvas.height) {
    ballSpeedY *= -1;
  }

  // player paddle hit
  if (ballX <= 20 && ballY > leftY && ballY < leftY + paddleHeight) {
    ballSpeedX *= -1;
    score++;
  }

  // computer paddle hit
  if (ballX >= 780 && ballY > rightY && ballY < rightY + paddleHeight) {
    ballSpeedX *= -1;
  }

  // 🔥 PLAYER MISS = submit + reset
  if (ballX < 0) {
    submitScore();
    resetBall();
  }

  // 🔥 COMPUTER MISS = JUST RESET BALL (no score reset)
  if (ballX > canvas.width) {
    ballX = 400;
    ballY = 200;
  }
}

function resetBall() {
  ballX = 400;
  ballY = 200;
  score = 0;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawRect(10, leftY, paddleWidth, paddleHeight);
  drawRect(780, rightY, paddleWidth, paddleHeight);

  drawBall();

  ctx.font = "24px Arial";
  ctx.fillText("Score: " + score, 20, 30);
}

document.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  leftY = e.clientY - rect.top - paddleHeight / 2;
});

function aiMove() {
  if (rightY + paddleHeight / 2 < ballY) {
    rightY += 3;
  } else {
    rightY -= 3;
  }
}

function gameLoop() {
  moveBall();
  aiMove();
  draw();
}

setInterval(gameLoop, 1000 / 60);

function submitScore() {
  if (score <= 0) return;

  const name = prompt("Enter your name:");
  if (!name) return;

  saveScore(name, score);
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUvm6aa-6FjJpCS6Ly4sVucjJPuNbgW-I",
  authDomain: "lone-star-arcade.firebaseapp.com",
  databaseURL: "https://lone-star-arcade-default-rtdb.firebaseio.com/",
  projectId: "lone-star-arcade",
  storageBucket: "lone-star-arcade.firebasestorage.app",
  messagingSenderId: "883063669150",
  appId: "1:883063669150:web:2aca2e85fa0b906f86568f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.saveScore = function(name, score) {
  push(ref(db, "scores/pong"), {
    name,
    score,
    time: Date.now()
  }).then(() => {
    getScores();
  });
};

window.getScores = async function() {
  const list = document.getElementById("scoresList");

  try {
    const q = query(ref(db, "scores/pong"), orderByChild("score"), limitToLast(10));
    const snapshot = await get(q);

    const scores = [];
    snapshot.forEach(child => {
      scores.push(child.val());
    });

    scores.reverse();

    if (scores.length === 0) {
      list.innerHTML = "No scores yet";
      return;
    }

    list.innerHTML = scores.map((s, i) =>
      `<div>${i + 1}. ${s.name}: ${s.score}</div>`
    ).join("");

  } catch (err) {
    console.error(err);
    list.innerHTML = "⚠️ Error loading scores";
  }
};

getScores();
</script>

</body>
</html>
