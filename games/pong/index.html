<!DOCTYPE html>
<html>
<head>
  <title>Texas Pong</title>
  <style>
    body {
      margin: 0;
      background: #1F3A5F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Poppins', sans-serif;
      color: white;
    }
    canvas {
      background: black;
      border: 4px solid #BF2F2F;
    }
  </style>
</head>

<body>

<canvas id="game" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let paddleHeight = 80;
let paddleWidth = 10;

let leftY = 150;
let rightY = 150;

let ballX = 400;
let ballY = 200;
let ballSpeedX = 4;
let ballSpeedY = 4;

let score = 0; // 🔥 add score tracking

function drawRect(x, y, w, h) {
  ctx.fillStyle = "white";
  ctx.fillRect(x, y, w, h);
}

function drawBall() {
  ctx.beginPath();
  ctx.arc(ballX, ballY, 8, 0, Math.PI * 2);
  ctx.fill();
}

function moveBall() {
  ballX += ballSpeedX;
  ballY += ballSpeedY;

  if (ballY <= 0 || ballY >= canvas.height) {
    ballSpeedY *= -1;
  }

  // left paddle
  if (ballX <= 20 && ballY > leftY && ballY < leftY + paddleHeight) {
    ballSpeedX *= -1;
    score++; // 🔥 increase score
  }

  // right paddle
  if (ballX >= 780 && ballY > rightY && ballY < rightY + paddleHeight) {
    ballSpeedX *= -1;
  }

  // MISS = submit score
  if (ballX < 0) {
    submitScore();
    resetBall();
  }

  if (ballX > canvas.width) {
    resetBall();
  }
}

function resetBall() {
  ballX = 400;
  ballY = 200;
  score = 0;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawRect(10, leftY, paddleWidth, paddleHeight);
  drawRect(780, rightY, paddleWidth, paddleHeight);

  drawBall();

  // 🔥 draw score
  ctx.font = "24px Poppins";
  ctx.fillText("Score: " + score, 20, 30);
}

document.addEventListener("mousemove", (e) => {
  const rect = canvas.getBoundingClientRect();
  leftY = e.clientY - rect.top - paddleHeight / 2;
});

function aiMove() {
  if (rightY + paddleHeight / 2 < ballY) {
    rightY += 3;
  } else {
    rightY -= 3;
  }
}

function gameLoop() {
  moveBall();
  aiMove();
  draw();
}

setInterval(gameLoop, 1000 / 60);

// 🔥 submit score to Firebase
function submitScore() {
  if (score <= 0) return;

  const name = prompt("Enter your name:");

  if (!name) return;

  saveScore(name, score);
}
</script>

  messagingSenderId: "883063669150",
  appId: "1:883063669150:web:2aca2e85fa0b906f86568f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// SAVE SCORE
window.saveScore = function(name, score) {
  push(ref(db, "scores/pong"), {
    name,
    score,
    time: Date.now()
  });
}

// GET SCORES (for later UI)
window.getScores = async function() {
  const q = query(ref(db, "scores/pong"), orderByChild("score"), limitToLast(10));
  const snapshot = await get(q);

  const scores = [];
  snapshot.forEach(child => {
    scores.push(child.val());
  });

  console.log(scores.reverse());
}
</script>

</body>
</html>
