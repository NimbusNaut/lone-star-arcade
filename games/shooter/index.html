<html>

  <title>Bluebonnet Blaster</title>
  <style>
    body {
      margin: 0;
      background: #1F3A5F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      background: black;
      border: 4px solid #6F7D5C;
    }

    #leaderboard {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      padding: 12px;
      border-radius: 8px;
      width: 200px;
      font-size: 14px;
    }

    #leaderboard strong {
      display: block;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="leaderboard">
  <strong>🏆 Top Scores</strong>
  <div id="scoresList">Loading...</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let playerX = 180;
let bullets = [];
let enemies = [];
let score = 0;
let gameOver = false;

function movePlayer(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  playerX = (clientX - rect.left) * scaleX - 10;

  if (playerX < 0) playerX = 0;
  if (playerX > 380) playerX = 380;
}

document.addEventListener("mousemove", e => {
  movePlayer(e.clientX);
});

document.addEventListener("touchmove", e => {
  e.preventDefault();
  movePlayer(e.touches[0].clientX);
}, { passive: false });

document.addEventListener("click", () => {
  if (!gameOver) {
    bullets.push({ x: playerX + 10, y: 550 });
  }
});

function spawnEnemy() {
  if (!gameOver) {
    enemies.push({ x: Math.random() * 380, y: 0 });
  }
}

setInterval(spawnEnemy, 1000);

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 15, 30);

  ctx.fillStyle = "white";
  ctx.fillRect(playerX, 560, 20, 20);

  bullets.forEach(b => {
    ctx.fillRect(b.x, b.y, 4, 10);
  });

  ctx.fillStyle = "#BF2F2F";
  enemies.forEach(e => {
    ctx.fillRect(e.x, e.y, 20, 20);
  });

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "32px Arial";
    ctx.fillText("Game Over", 115, 280);
    ctx.font = "18px Arial";
    ctx.fillText("Refresh to play again", 120, 315);
  }
}

function update() {
  if (gameOver) return;

  bullets.forEach(b => b.y -= 5);
  enemies.forEach(e => e.y += 2);

  bullets = bullets.filter(b => b.y > 0);

  enemies = enemies.filter(e => {
    const hit = bullets.some(b =>
      b.x > e.x &&
      b.x < e.x + 20 &&
      b.y > e.y &&
      b.y < e.y + 20
    );

    if (hit) {
      score++;
      return false;
    }

    if (e.y > 580) {
      endGame();
      return false;
    }

    return true;
  });
}

function endGame() {
  gameOver = true;

  if (score <= 0) return;

  const name = prompt("Enter your name:");
  if (!name) return;

  saveScore(name, score);
}

function loop() {
  update();
  draw();
}

setInterval(loop, 1000 / 60);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUvm6aa-6FjJpCS6Ly4sVucjJPuNbgW-I",
  authDomain: "lone-star-arcade.firebaseapp.com",
  databaseURL: "https://lone-star-arcade-default-rtdb.firebaseio.com/",
  projectId: "lone-star-arcade",
  storageBucket: "lone-star-arcade.firebasestorage.app",
  messagingSenderId: "883063669150",
  appId: "1:883063669150:web:2aca2e85fa0b906f86568f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.saveScore = function(name, score) {
  push(ref(db, "scores/shooter"), {
    name,
    score,
    time: Date.now()
  }).then(() => {
    getScores();
  });
};

window.getScores = async function() {
  const list = document.getElementById("scoresList");

  try {
    const q = query(ref(db, "scores/shooter"), orderByChild("score"), limitToLast(10));
    const snapshot = await get(q);

    const scores = [];
    snapshot.forEach(child => {
      scores.push(child.val());
    });

    scores.reverse();

    if (scores.length === 0) {
      list.innerHTML = "No scores yet";
      return;
    }

    list.innerHTML = scores.map((s, i) =>
      `<div>${i + 1}. ${s.name}: ${s.score}</div>`
    ).join("");

  } catch (err) {
    console.error(err);
    list.innerHTML = "⚠️ Error loading scores";
  }
};

getScores();
</script>

</body>
</html>
