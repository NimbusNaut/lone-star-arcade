<!DOCTYPE html>
<html>
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B45GQ3KZ3X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <title>Bluebonnet Blaster</title>

  <style>
    body {
      margin: 0;
      background: #1F3A5F;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      background: black;
      border: 4px solid #6F7D5C;
    }

    #leaderboard {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      padding: 12px;
      border-radius: 8px;
      width: 200px;
      font-size: 14px;
    }

    #leaderboard strong {
      display: block;
      margin-bottom: 8px;
    }

    .score-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .score-box {
      background: #1F3A5F;
      border: 3px solid #F4F1EC;
      border-radius: 16px;
      padding: 24px;
      width: 320px;
      text-align: center;
      color: white;
      box-shadow: 0 0 25px rgba(191,47,47,0.7);
    }

    .score-box h2 {
      margin: 0 0 8px;
      color: #F4F1EC;
    }

    .score-box p {
      margin: 6px 0;
    }

    .score-box input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 8px;
      border: 0;
      font-size: 16px;
      text-align: center;
    }

    .score-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }

    .score-actions button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .score-actions button:first-child {
      background: #BF2F2F;
      color: white;
    }

    .score-actions button:last-child {
      background: #F4F1EC;
      color: #1F3A5F;
    }
  </style>
</head>

<body>

<canvas id="game" width="400" height="600"></canvas>

<div id="leaderboard">
  <strong>🏆 Top Scores</strong>
  <div id="scoresList">Loading...</div>
</div>

<div id="scoreModal" class="score-modal">
  <div class="score-box">
    <h2>🏆 New Score!</h2>
    <p>You scored <strong id="finalScore">0</strong></p>
    <p>Enter your name:</p>
    <input id="playerName" type="text" maxlength="20" placeholder="Your name" />
    <div class="score-actions">
      <button onclick="submitPlayerScore()">Save Score</button>
      <button onclick="skipScore()">Skip</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let playerX = 180;
let bullets = [];
let enemies = [];
let score = 0;
let gameOver = false;
let scoreModalOpen = false;

const enemyEmojis = ["🐄", "🐖", "🐔"];

function movePlayer(clientX) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  playerX = (clientX - rect.left) * scaleX - 10;

  if (playerX < 0) playerX = 0;
  if (playerX > 380) playerX = 380;
}

document.addEventListener("mousemove", e => {
  movePlayer(e.clientX);
});

document.addEventListener("touchmove", e => {
  e.preventDefault();
  movePlayer(e.touches[0].clientX);
}, { passive: false });

function shoot() {
  if (!gameOver && !scoreModalOpen) {
    bullets.push({ x: playerX + 10, y: 550 });
  }
}

document.addEventListener("click", shoot);

document.addEventListener("touchstart", e => {
  e.preventDefault();
  movePlayer(e.touches[0].clientX);
  shoot();
}, { passive: false });

function spawnEnemy() {
  if (!gameOver && !scoreModalOpen) {
    enemies.push({
      x: Math.random() * 360,
      y: 0,
      emoji: enemyEmojis[Math.floor(Math.random() * enemyEmojis.length)]
    });
  }
}

setInterval(spawnEnemy, 1000);

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 15, 30);

  ctx.font = "32px serif";
  ctx.fillText("🤠", playerX - 6, 580);

  ctx.font = "20px serif";
  bullets.forEach(b => {
    ctx.fillText("💥", b.x - 7, b.y);
  });

  ctx.font = "30px serif";
  enemies.forEach(e => {
    ctx.fillText(e.emoji, e.x, e.y + 24);
  });

  if (gameOver) {
    ctx.fillStyle = "white";
    ctx.font = "32px Arial";
    ctx.fillText("Game Over", 115, 280);
  }
}

function update() {
  if (gameOver || scoreModalOpen) return;

  bullets.forEach(b => b.y -= 6);
  enemies.forEach(e => e.y += 2);

  bullets = bullets.filter(b => b.y > 0);

  enemies = enemies.filter(e => {
    const hit = bullets.some(b =>
      b.x > e.x &&
      b.x < e.x + 32 &&
      b.y > e.y &&
      b.y < e.y + 32
    );

    if (hit) {
      score++;
      return false;
    }

    if (e.y > 580) {
      endGame();
      return false;
    }

    return true;
  });
}

function endGame() {
  gameOver = true;

  if (score <= 0) return;

  scoreModalOpen = true;
  document.getElementById("finalScore").textContent = score;
  document.getElementById("scoreModal").style.display = "flex";

  setTimeout(() => {
    document.getElementById("playerName").focus();
  }, 100);
}

function submitPlayerScore() {
  const name = document.getElementById("playerName").value.trim();

  if (!name) return;

  saveScore(name, score);
  closeScoreModal();
}

function skipScore() {
  closeScoreModal();
}

function closeScoreModal() {
  document.getElementById("scoreModal").style.display = "none";
  document.getElementById("playerName").value = "";
  scoreModalOpen = false;
}

document.getElementById("playerName").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    submitPlayerScore();
  }
});

function loop() {
  update();
  draw();
}

setInterval(loop, 1000 / 60);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getDatabase, ref, push, get, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDUvm6aa-6FjJpCS6Ly4sVucjJPuNbgW-I",
  authDomain: "lone-star-arcade.firebaseapp.com",
  databaseURL: "https://lone-star-arcade-default-rtdb.firebaseio.com/",
  projectId: "lone-star-arcade",
  storageBucket: "lone-star-arcade.firebasestorage.app",
  messagingSenderId: "883063669150",
  appId: "1:883063669150:web:2aca2e85fa0b906f86568f"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.saveScore = function(name, score) {
  push(ref(db, "scores/shooter"), {
    name,
    score,
    time: Date.now()
  }).then(() => {
    getScores();
  });
};

window.getScores = async function() {
  const list = document.getElementById("scoresList");

  try {
    const q = query(ref(db, "scores/shooter"), orderByChild("score"), limitToLast(10));
    const snapshot = await get(q);

    const scores = [];
    snapshot.forEach(child => {
      scores.push(child.val());
    });

    scores.reverse();

    if (scores.length === 0) {
      list.innerHTML = "No scores yet";
      return;
    }

    list.innerHTML = scores.map((s, i) =>
      `<div>${i + 1}. ${s.name}: ${s.score}</div>`
    ).join("");

  } catch (err) {
    console.error(err);
    list.innerHTML = "⚠️ Error loading scores";
  }
};

getScores();
</script>

</body>
</html>
