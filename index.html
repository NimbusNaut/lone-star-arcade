<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lone Star Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B45GQ3KZ3X"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-B45GQ3KZ3X');
  </script>
</head>

<body>
  <div class="arcade-room">
    <div class="brand">Lone Star Guide</div>

    <div class="neon-sign">
      <div class="star">★</div>
      <h1>Lone Star<br><span>Arcade</span></h1>
      <p>Texas-sized mini games</p>
    </div>

    <div class="machines">
      <div class="cabinet orange" onclick="launchGame('games/pong/index.html')">
        <div class="marquee">Texas Pong</div>
        <div class="screen">
          <div class="screen-icon">🏓</div>
          <div class="mini-board">
            <strong>Top Scores</strong>
            <div id="pongScores">Loading...</div>
          </div>
        </div>
        <div class="controls">
          <span></span><button></button><button></button>
        </div>
        <div class="base"></div>
      </div>

      <div class="cabinet red" onclick="launchGame('games/bbq/index.html')">
        <div class="marquee">BBQ Dash</div>
        <div class="screen">
          <div class="screen-icon">🍖</div>
          <div class="mini-board">
            <strong>Top Scores</strong>
            <div id="bbqScores">Loading...</div>
          </div>
        </div>
        <div class="controls">
          <span></span><button></button><button></button>
        </div>
        <div class="base"></div>
      </div>

      <div class="cabinet blue" onclick="launchGame('games/shooter/index.html')">
        <div class="marquee">Bluebonnet Blaster</div>
        <div class="screen">
          <div class="screen-icon">💙</div>
          <div class="mini-board">
            <strong>Top Scores</strong>
            <div id="shooterScores">Loading...</div>
          </div>
        </div>
        <div class="controls">
          <span></span><button></button><button></button>
        </div>
        <div class="base"></div>
      </div>
    </div>

    <div class="floor"></div>
  </div>

  <div id="gameModal" class="modal">
    <button class="close" onclick="closeGame()">×</button>
    <iframe id="gameFrame"></iframe>
  </div>

  <script type="module" src="script.js"></script>

  <div class="arcade-footer">
  Looking for things to do this week? 
  <a href="https://lonestarguide.org" target="_blank">
    Explore events, best-of lists, and local guides →
  </a>
</div>
  
</body>
</html>
